[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgelab"
version = "0.2.0"
description = "Autonomous trading-strategy research lab (paper money only)"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas>=2.2", "scipy", "statsmodels", "pyarrow", "duckdb", "requests",
  "exchange_calendars", "lxml", "pytest",
]

[tool.setuptools.packages.find]
include = ["edgelab*", "selftest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
